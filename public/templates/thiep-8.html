/* 2. DESIGN TOKENS (Scoped to .thiep-8) */
.thiep-8 {
  --bg-space: #000000;
  --bg-wine-deep: #090205;
  --bg-wine-center: #2d0612;
  --bg-wine-glow: #480a1c;
  --bg-modal-backdrop: #101020;
  --pink-neon: #ff5b91;
  --pink-deep: #d50065;
  --pink-bright: #ff0068;
  --pink-soft: #ff9dbc;
  --pink-pale: #ffe0eb;
  --paper-ivory: #fffdfa;
  --paper-envelope: #fdfdfd;
  --paper-shadow: rgba(0, 0, 0, 0.35);
  --ink-body: #3f3b39;
  --ink-muted: #75706d;
  --ink-title: #d50065;
  --font-script: 'Dancing Script', 'Segoe Script', cursive, serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

/* RESET */
.thiep-8, .thiep-8 * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

.thiep-8 {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background-color: var(--bg-space);
  color: #fff;
  font-family: var(--font-ui);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  z-index: 1;
}

/* ====================================================
   SCENE 1: UNIVERSE (CANVAS & PARTICLES)
   ==================================================== */
.thiep-8 .universe-scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
  transition: filter 0.6s ease, transform 0.8s cubic-bezier(.22, 1, .36, 1);
  will-change: filter, transform;
  z-index: 2;
}

.thiep-8 .universe-scene.zooming {
  filter: blur(14px);
  transform: scale(2.4);
}

.thiep-8 .universe-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* Transparent touch hotspot */
.thiep-8 .heart-hotspot {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  cursor: pointer;
  z-index: 5;
  outline: none;
}

/* ====================================================
   FLASH OVERLAY (ZOOM INTO HEART)
   ==================================================== */
.thiep-8 .flash-overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 42%, #fff3f7 0%, #ffc1d9 35%, #ed377e 72%, #7a0033 100%);
  opacity: 0;
  pointer-events: none;
  z-index: 10;
  transition: opacity 0.3s cubic-bezier(.2, 0, 0, 1);
  will-change: opacity;
}

/* ====================================================
   SCENE 2: WORLD 2 (ENVELOPE, 3D CARD, WINE BACKGROUND)
   ==================================================== */
.thiep-8 .envelope-world {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 50% 64%, var(--bg-wine-glow) 0%, var(--bg-wine-center) 42%, var(--bg-wine-deep) 88%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s ease;
  overflow: hidden;
  z-index: 3;
}

.thiep-8 .envelope-world.active {
  opacity: 1;
  pointer-events: auto;
}

/* Floating Hearts Background Layer */
.thiep-8 .floating-hearts-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}

.thiep-8 .bg-heart {
  position: absolute;
  pointer-events: none;
  filter: drop-shadow(0 0 10px rgba(255, 30, 110, 0.65));
  animation: floatUpward linear infinite;
  opacity: 0.85;
}

@keyframes floatUpward {
  0% {
    transform: translateY(0) translateX(0) rotate(0deg) scale(0.9);
    opacity: 0;
  }
  8% {
    opacity: 0.88;
  }
  90% {
    opacity: 0.88;
  }
  100% {
    transform: translateY(calc(-100vh - 120px)) translateX(var(--drift-x, 20px)) rotate(var(--rot, 25deg)) scale(1.05);
    opacity: 0;
  }
}

/* ====================================================
   3D ENVELOPE & PAPER CARD LAYERS (Mục 7)
   Envelope in lower area: y = 66–89% H
   ==================================================== */
.thiep-8 .envelope-stage {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: calc(8vh + var(--safe-bottom));
  z-index: 2;
  perspective: 1200px;
  -webkit-perspective: 1200px;
  transition: opacity 0.45s ease, transform 0.45s ease;
}

.thiep-8 .envelope-stage.hidden-during-gallery {
  opacity: 0;
  pointer-events: none;
  transform: translateY(40px);
}

.thiep-8 .envelope-container {
  position: relative;
  width: min(92vw, 360px);
  height: calc(min(92vw, 360px) / 1.58);
  perspective: 1200px;
  -webkit-perspective: 1200px;
  transform-style: preserve-3d;
  cursor: pointer;
  outline: none;
}

/* Envelope Soft Ambient Shadow */
.thiep-8 .envelope-shadow {
  position: absolute;
  bottom: -18px;
  left: 5%;
  width: 90%;
  height: 28px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0, 0, 0, 0.65) 0%, rgba(30, 4, 12, 0.4) 45%, transparent 75%);
  filter: blur(10px);
  pointer-events: none;
}

/* 1. Envelope Back Face */
.thiep-8 .envelope-back {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #fdfdfd 0%, #ebe7e0 100%);
  border-radius: 10px;
  box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.05);
  z-index: 1;
}

/* 2. Envelope Top Flap (Triangular flap that hinges at top) */
.thiep-8 .envelope-flap-top {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 52%;
  transform-origin: top center;
  transform-style: preserve-3d;
  transition: transform 0.65s cubic-bezier(.4, 0, .2, 1);
  z-index: 8;
}

.thiep-8 .flap-triangle {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #fdfdfd 0%, #ede8e0 100%);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  -webkit-clip-path: polygon(0 0, 100% 0, 50% 100%);
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.10));
}

.thiep-8 .envelope-container.flap-open .envelope-flap-top {
  transform: rotateX(-175deg);
  z-index: 1;
}

/* 3. The Paper Card (Inside Pocket) - Vertical format (Ratio ~0.74) */
.thiep-8 .card-trans-wrapper {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: min(58vw, 210px);
  height: calc(min(58vw, 210px) / 0.74); /* ~284px vertical card */
  transform-style: preserve-3d;
  z-index: 3;
  pointer-events: none;
}

.thiep-8 .card-book-assembly {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transform-origin: center center;
  transition: transform 0.9s cubic-bezier(.22, .61, .36, 1);
}

/* Inside Right Page (Fixed Base) */
.thiep-8 .card-leaf-right {
  position: absolute;
  inset: 0;
  background: var(--paper-ivory);
  border-radius: 8px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 18px 14px;
  overflow: hidden;
  border-left: 1px solid rgba(0, 0, 0, 0.08);
}

.thiep-8 .card-preview-text {
  font-family: var(--font-script);
  font-size: 15px;
  line-height: 1.65;
  color: var(--ink-body);
  text-align: center;
  font-style: italic;
  opacity: 0.92;
}

/* Inside Left Leaf (Hinges on Left Spine rotateY 0 -> -150deg) */
.thiep-8 .card-leaf-left {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform 0.95s cubic-bezier(.4, 0, .2, 1);
  z-index: 4;
}

.thiep-8 .leaf-face {
  position: absolute;
  inset: 0;
  border-radius: 8px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/* Outer Cover Face */
.thiep-8 .leaf-face.front {
  background: linear-gradient(135deg, #ffffff 0%, #faf6f2 100%);
  box-shadow: inset 0 0 12px rgba(213, 0, 101, 0.05), 0 4px 14px rgba(0, 0, 0, 0.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid rgba(255, 255, 255, 0.9);
}

.thiep-8 .cover-eyebrow {
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 4px;
  color: #8c8582;
  text-transform: uppercase;
}

.thiep-8 .cover-title {
  font-family: var(--font-script);
  font-size: 34px;
  font-weight: 700;
  color: var(--pink-deep);
  text-shadow: 0 1px 3px rgba(213, 0, 101, 0.2);
  line-height: 1.1;
}

.thiep-8 .cover-heart {
  font-size: 14px;
  color: #9c9592;
  margin-top: 2px;
}

/* Inner Left Face (Shows Photo) */
.thiep-8 .leaf-face.back {
  background: #fdfbf7;
  transform: rotateY(180deg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  box-shadow: inset -5px 0 10px rgba(0,0,0,0.06);
}

.thiep-8 .inner-photo-frame {
  width: 90%;
  height: 90%;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  border: 2px solid #ffffff;
}

.thiep-8 .inner-photo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* 4. Envelope Front Pocket (Left, Right, Bottom Triangles - Seamless) */
.thiep-8 .envelope-pocket-front {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

.thiep-8 .pocket-side-left {
  position: absolute;
  top: 0;
  left: 0;
  width: 50.5%;
  height: 100%;
  background: linear-gradient(135deg, #eae5dc 0%, #dbd4c9 100%);
  clip-path: polygon(0 0, 100% 50%, 0 100%);
  -webkit-clip-path: polygon(0 0, 100% 50%, 0 100%);
}

.thiep-8 .pocket-side-right {
  position: absolute;
  top: 0;
  right: 0;
  width: 50.5%;
  height: 100%;
  background: linear-gradient(-135deg, #eae5dc 0%, #dbd4c9 100%);
  clip-path: polygon(100% 0, 0 50%, 100% 100%);
  -webkit-clip-path: polygon(100% 0, 0 50%, 100% 100%);
}

.thiep-8 .pocket-bottom {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 64%;
  background: linear-gradient(0deg, #f2ece3 0%, #e0d9cc 100%);
  clip-path: polygon(0 100%, 100% 100%, 50% 15%);
  -webkit-clip-path: polygon(0 100%, 100% 100%, 50% 15%);
  filter: drop-shadow(0 -3px 5px rgba(0,0,0,0.06));
}

/* 5. Wax Seal Heart */
.thiep-8 .wax-seal {
  position: absolute;
  top: 51%;
  left: 50%;
  width: 44px;
  height: 42px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 35% 35%, #ff4d88 0%, #d50065 65%, #9b0042 100%);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(213, 0, 101, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.4);
  z-index: 9;
  transition: transform 0.25s ease, opacity 0.25s ease;
  cursor: pointer;
}

.thiep-8 .wax-seal::after {
  content: "♥";
  font-size: 20px;
  color: #fff;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
}

.thiep-8 .wax-seal.broken {
  transform: translate(-50%, -50%) scale(0.3);
  opacity: 0;
}

/* Text underneath envelope (Small light grey, not in a pill button!) */
.thiep-8 .envelope-hint {
  margin-top: 18px;
  font-size: 13.5px;
  color: #a59fa2;
  letter-spacing: 0.3px;
  text-align: center;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

/* ====================================================
   SCENE 3: READING LETTER PANEL (MODAL - Mục 8)
   Width 94–96%, Height 73–76%, Border-radius 18–22px
   ==================================================== */
.thiep-8 .reading-backdrop {
  position: absolute;
  inset: 0;
  background: var(--bg-modal-backdrop);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 15;
}

.thiep-8 .reading-backdrop.active {
  opacity: 0.92;
  pointer-events: auto;
}

.thiep-8 .reading-panel {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.95);
  width: min(95vw, 440px);
  height: min(75vh, 620px);
  background: var(--paper-ivory);
  border-radius: 20px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.35);
  opacity: 0;
  transition: transform 0.42s cubic-bezier(.16, 1, .3, 1), opacity 0.38s ease;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 16;
}

.thiep-8 .reading-panel.active {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

/* Close Button (×) - Top-right, pink circle 32px, hit target 44x44px */
.thiep-8 .btn-close-letter {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 20;
  outline: none;
}

.thiep-8 .close-circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--pink-deep);
  color: #fff;
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 10px rgba(213, 0, 101, 0.4);
  transition: transform 0.2s ease, background-color 0.2s;
}

.thiep-8 .btn-close-letter:hover .close-circle {
  transform: scale(1.08);
  background: #ff1a7a;
}

/* Reading Body (Scrollable if message is long, stable dimensions) */
.thiep-8 .reading-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 24px 22px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  scrollbar-width: thin;
  scrollbar-color: rgba(213, 0, 101, 0.3) transparent;
}

.thiep-8 .reading-body::-webkit-scrollbar {
  width: 4px;
}
.thiep-8 .reading-body::-webkit-scrollbar-thumb {
  background: rgba(213, 0, 101, 0.3);
  border-radius: 10px;
}

/* A. Portrait photo (58–62% panel width, ratio ~0.88, no caption/badge) */
.thiep-8 .modal-photo-wrap {
  width: min(60%, 200px);
  aspect-ratio: 0.88;
  border-radius: 9px;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(60, 10, 30, 0.16);
  border: 2.5px solid #ffffff;
  margin-top: 4px;
  margin-bottom: 22px;
  flex-shrink: 0;
}

.thiep-8 .modal-photo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* B. Greeting message (18–24px below photo, 86–90% width, stable height) */
.thiep-8 .letter-text-box {
  position: relative;
  width: 88%;
  margin-bottom: 24px;
}

/* Hidden ghost text for height reservation */
.thiep-8 .ghost-message {
  visibility: hidden;
  font-family: var(--font-script);
  font-size: 16px;
  line-height: 1.72;
  text-align: center;
  color: var(--ink-body);
  user-select: none;
  pointer-events: none;
  white-space: pre-line;
}

/* Live typed text overlay */
.thiep-8 .typed-message {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  font-family: var(--font-script);
  font-size: 16px;
  line-height: 1.72;
  text-align: center;
  color: var(--ink-body);
  word-break: break-word;
  white-space: pre-line;
}

.thiep-8 .typewriter-cursor {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  background-color: var(--pink-deep);
  vertical-align: -0.15em;
  margin-left: 2px;
  animation: cursorBlink 0.75s infinite ease-in-out;
}

@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* C. Deep Red Beating Heart (30–44px below text, 26px, soft pink glow, slow pulse) */
.thiep-8 .modal-beating-heart {
  font-size: 26px;
  color: #cf0040;
  filter: drop-shadow(0 2px 10px rgba(255, 40, 100, 0.4));
  animation: modalHeartPulse 2.0s infinite ease-in-out;
  margin-top: 14px;
  margin-bottom: 8px;
}

@keyframes modalHeartPulse {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.10); }
  40% { transform: scale(0.98); }
  60% { transform: scale(1.06); }
}

/* ====================================================
   SCENE 4: GALLERY (FLOATING MEMORY PHOTOS - Mục 10)
   Width 35–43% stage, near-square, white border, pink glow
   NO captions, NO bottom buttons!
   ==================================================== */
.thiep-8 .gallery-container {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 12;
}

.thiep-8 .floating-memory-card {
  position: absolute;
  width: clamp(135px, 40vw, 168px);
  aspect-ratio: 1 / 1.15;
  border: 2.5px solid var(--paper-ivory);
  border-radius: 11px;
  box-shadow: 0 0 16px rgba(255, 0, 120, 0.45), 0 12px 28px rgba(0, 0, 0, 0.4);
  overflow: hidden;
  will-change: transform, opacity;
  pointer-events: none;
  z-index: 13;
}

.thiep-8 .floating-memory-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ====================================================
   RESPONSIVE & DESKTOP (Mục 12)
   ==================================================== */
@media (min-width: 600px) {
  .thiep-8 .envelope-stage {
    padding-bottom: calc(7vh + var(--safe-bottom));
  }
  .thiep-8 .envelope-container {
    width: 380px;
    height: 240px;
  }
  .thiep-8 .card-trans-wrapper {
    width: 220px;
    height: 297px;
  }
  .thiep-8 .reading-panel {
    width: 440px;
    height: 580px;
  }
}

@media (max-height: 640px) {
  .thiep-8 .envelope-stage {
    padding-bottom: calc(4vh + var(--safe-bottom));
  }
  .thiep-8 .modal-photo-wrap {
    width: min(50%, 150px);
    margin-bottom: 14px;
  }
  .thiep-8 .reading-panel {
    height: 90vh;
  }
  .thiep-8 .reading-body {
    padding: 18px 16px;
  }
}

/* REDUCED MOTION (Mục 12) */
@media (prefers-reduced-motion: reduce) {
  .thiep-8 .universe-scene.zooming {
    filter: none;
    transform: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .thiep-8 .bg-heart {
    animation: none;
    display: none;
  }
  .thiep-8 .floating-memory-card {
    transition: opacity 0.5s ease;
  }
  .thiep-8 .modal-beating-heart {
    animation: none;
  }
}

  <div id="thiep-8-app" class="thiep-8">
    <!-- SCENE 1: UNIVERSE (3D VOLUMETRIC HEART & ORBIT SYSTEM) -->
    <section class="universe-scene" aria-label="Vũ trụ trái tim sao">

      <button class="heart-hotspot" type="button" aria-label="Mở món quà" title="Mở món quà"></button>

    <div class="flash-overlay" aria-hidden="true"></div>

    <div class="envelope-world" aria-label="Phong thư kỷ niệm">

      <div class="floating-hearts-layer" aria-hidden="true"></div>

      <!-- Envelope Stage in lower screen area (y = 66–89%) -->
      <div class="envelope-stage">
        <div class="envelope-container" tabindex="0" role="button" aria-label="Mở phong thư">
          <div class="envelope-shadow"></div>

          <div class="envelope-flap-top">

          <div class="card-trans-wrapper">
            <div class="card-book-assembly">
              <!-- Inside Right Page -->
              <div class="card-leaf-right">
                <div class="card-preview-text"></div>
              </div>

              <!-- Spine Hinge Left Leaf (Book cover opens rotateY 0 -> -150deg) -->
              <div class="card-leaf-left">
                <!-- Outer Cover Face -->
                <div class="leaf-face front">
                  <span class="cover-eyebrow">DEAR</span>
                  <span class="cover-title">My Love</span>
                  <span class="cover-heart">♥</span>
                </div>
                <!-- Inner Face with User Photo -->

  <script>
/**
 * THIỆP 8 — Vũ trụ trái tim particle 3D có thể tích & hệ vòng chữ elip 3D
 * Tuân thủ mục 4 & 5 tài liệu đặc tả
 */

class Thiep8Universe {
  constructor(container, config, callbacks = {}) {
    this.container = container;
    this.config = config || {};
    this.callbacks = callbacks; // onZoomComplete

    this.canvas = container.querySelector('.universe-canvas');
    this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
    this.hotspotEl = container.querySelector('.heart-hotspot');

    this.isRunning = false;
    this.isZooming = false;
    this.zoomProgress = 0;
    this.zoomStartTime = 0;
    this.rafId = null;
    this.startTime = performance.now();
    this.lastTime = this.startTime;

    // Quality parameters (Mục 4 & 12)
    this.isMobile = window.innerWidth < 600;
    this.heartParticleCount = this.isMobile ? 6500 : 11000;
    this.starCount = this.isMobile ? 220 : 380;
    this.dustCount = this.isMobile ? 800 : 1400;

    // Viewport
    this.width = 0;
    this.height = 0;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);

    // Parallax
    this.targetParallaxX = 0;
    this.targetParallaxY = 0;
    this.currentParallaxX = 0;
    this.currentParallaxY = 0;

    // Model data
    this.stars = [];
    this.meteors = [];
    this.heartParticles = [];
    this.orbitDust = [];
    this.orbitRings = [];
    this.orbitThumbnails = [];
    this.photoImages = [];

    this.preloadPhotos();
    this.initListeners();
    this.resize();
    this.createStars();
    this.createVolumetricHeart();
    this.createOrbitSystem();
  }

  preloadPhotos() {
    const photos = this.config.photos || [];
    photos.forEach((p, idx) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = p.src;
      this.photoImages.push({ img, loaded: false });
      img.onload = () => {
        if (this.photoImages[idx]) this.photoImages[idx].loaded = true;
      };
      img.onerror = () => {
        if (this.photoImages[idx]) this.photoImages[idx].loaded = false;
      };
    });
  }

  initListeners() {
    this.handleResize = () => this.resize();
    window.addEventListener('resize', this.handleResize, { passive: true });

    this.handlePointerMove = (e) => {
      if (this.isZooming) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const normX = (clientX / this.width - 0.5) * 2;
      const normY = (clientY / this.height - 0.5) * 2;
      this.targetParallaxX = normX * 7;
      this.targetParallaxY = normY * 5;
    };
    window.addEventListener('mousemove', this.handlePointerMove, { passive: true });
    window.addEventListener('touchmove', this.handlePointerMove, { passive: true });

    // Touch/click anywhere on intro advances to zoom
    this.handleIntroClick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      this.triggerZoom();
    };

    if (this.hotspotEl) {
      this.hotspotEl.addEventListener('click', this.handleIntroClick);
      this.hotspotEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          this.triggerZoom();
        }
      });
    }

    this.container.addEventListener('click', this.handleIntroClick);

    // Auto advance if configured (7.8s)
    if (this.config.intro && this.config.intro.autoAdvanceMs) {
      this.autoAdvanceTimer = setTimeout(() => {
        if (!this.isZooming && this.isRunning) {
          this.triggerZoom();
        }
      }, this.config.intro.autoAdvanceMs);
    }
  }

  resize() {
    if (!this.canvas) return;
    this.width = this.container.clientWidth || window.innerWidth;
    this.height = this.container.clientHeight || window.innerHeight;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);

    this.canvas.width = Math.floor(this.width * this.dpr);
    this.canvas.height = Math.floor(this.height * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  }

  createStars() {
    this.stars = [];
    for (let i = 0; i < this.starCount; i++) {
      this.stars.push({
        x: Math.random() * this.width,
        y: Math.random() * this.height,
        size: 0.35 + Math.random() * 0.95,
        baseAlpha: 0.2 + Math.random() * 0.65,
        twinkleSpeed: 0.8 + Math.random() * 2.2,
        phase: Math.random() * Math.PI * 2,
        color: Math.random() > 0.8 ? '#e8f0fe' : '#fff5f8'
      });
    }
  }

  /**
   * 3D Volumetric Heart using Taubin formulation:
   * (x^2 + y^2 + 2.25*z^2 - 1)^3 - x^2*y^3 - 0.1125*z^2*y^3 <= 0
   * Provides full lobes, clean cleft, tapered tip, and ZERO center seam!
   */
  createVolumetricHeart() {
    this.heartParticles = [];
    const count = this.heartParticleCount;
    const colors = ['#ff5b91', '#ff3377', '#ff8fa3', '#ffc2d1', '#ffffff', '#ff1a6b'];

    let tries = 0;
    while (this.heartParticles.length < count && tries < count * 8) {
      tries++;
      // Bounding box for Taubin equation
      const x = (Math.random() - 0.5) * 2.3;
      const y = -0.95 + Math.random() * 2.2;
      const z = (Math.random() - 0.5) * 1.35;

      const a = x * x + y * y + 2.25 * z * z - 1;
      const val = a * a * a - x * x * y * y * y - 0.1125 * z * z * y * y * y;

      if (val <= 0) {
        // Points closer to boundary have slightly higher brightness
        const isNearBoundary = val > -0.08;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const baseSize = isNearBoundary ? (1.1 + Math.random() * 1.2) : (0.8 + Math.random() * 0.9);
        const alpha = isNearBoundary ? (0.75 + Math.random() * 0.25) : (0.45 + Math.random() * 0.35);

        this.heartParticles.push({
          baseX: x,
          baseY: y,
          baseZ: z,
          vibePhase: Math.random() * Math.PI * 2,
          vibeSpeed: 3 + Math.random() * 4,
          color: color,
          baseSize: baseSize,
          alpha: alpha,
          isNearBoundary: isNearBoundary
        });
      }
    }
  }

  /**
   * 3D Concentric Orbit System (Mục 5):
   * Occupying y = 52–76%, common center, 68° tilt
   */
  createOrbitSystem() {
    // 1. Dust particles on 5 concentric rings
    this.orbitDust = [];
    const bandRadii = [0.20, 0.26, 0.32, 0.38, 0.44];
    for (let i = 0; i < this.dustCount; i++) {
      const bandIndex = Math.floor(Math.random() * bandRadii.length);
      const r = bandRadii[bandIndex] + (Math.random() - 0.5) * 0.03;
      const angle = Math.random() * Math.PI * 2;
      this.orbitDust.push({
        radiusRatio: r,
        angle: angle,
        speed: (0.06 + (bandIndex % 2 === 0 ? 0.05 : -0.04)) * (0.8 + Math.random() * 0.4),
        size: 0.6 + Math.random() * 1.2,
        color: Math.random() > 0.4 ? '#ff8fa3' : '#ff3377',
        alpha: 0.35 + Math.random() * 0.45
      });
    }

    // 2. Mini Hearts orbiting along rings
    this.miniHearts = [];
    for (let i = 0; i < 18; i++) {
      const band = bandRadii[1 + (i % 3)];
      this.miniHearts.push({
        radiusRatio: band + (Math.random() - 0.5) * 0.02,
        angle: (i / 18) * Math.PI * 2,
        speed: 0.08 * (i % 2 === 0 ? 1 : -0.9),
        size: 3.5 + Math.random() * 3,
        color: i % 3 === 0 ? '#ffb3cb' : '#ff3377'
      });
    }

    // 3. 3D Orbiting Text Rings
    const messages = (this.config.orbitMessages && this.config.orbitMessages.length > 0)
      ? this.config.orbitMessages
      : [
          'Anh yêu em nhiều lắm!',
          'Mãi mãi bên em',
          'Em là cả thế giới của anh',
          'Yêu em mỗi ngày',
          'Cảm ơn em đã đến bên anh'
        ];

    this.orbitRings = [
      { radiusRatio: 0.26, speed: 0.11, text: messages[0], angleOffset: 0 },
      { radiusRatio: 0.33, speed: -0.09, text: messages[1 % messages.length], angleOffset: Math.PI * 0.5 },
      { radiusRatio: 0.39, speed: 0.12, text: messages[2 % messages.length], angleOffset: Math.PI },
      { radiusRatio: 0.44, speed: -0.08, text: messages[3 % messages.length], angleOffset: Math.PI * 1.4 }
    ];

    // 4. Rotating memory fragments near the common center
    this.orbitThumbnails = [];
    const photoCount = Math.min((this.config.photos ? this.config.photos.length : 3), 4);
    for (let i = 0; i < photoCount; i++) {
      this.orbitThumbnails.push({
        photoIndex: i,
        radiusRatio: 0.14,
        angle: (i / photoCount) * Math.PI * 2,
        speed: 0.14,
        width: 30,
        height: 38
      });
    }
  }

  spawnMeteor() {
    if (this.meteors.length >= 2 || Math.random() > 0.025) return;
    this.meteors.push({
      x: this.width * (0.35 + Math.random() * 0.65),
      y: this.height * (Math.random() * 0.28),
      length: 28 + Math.random() * 38,
      speed: 360 + Math.random() * 220,
      angle: Math.PI * 0.72 + (Math.random() - 0.5) * 0.08,
      life: 0,
      maxLife: 0.6 + Math.random() * 0.5
    });
  }

  start() {
    if (this.isRunning) return;
    this.isRunning = true;
    this.startTime = performance.now();
    this.lastTime = this.startTime;
    this.loop();
  }

  stop() {
    this.isRunning = false;
    if (this.rafId) {
      cancelAnimationFrame(this.rafId);
      this.rafId = null;
    }
  }

  triggerZoom() {
    if (this.isZooming) return;
    this.isZooming = true;
    this.zoomStartTime = performance.now();

    if (this.autoAdvanceTimer) {
      clearTimeout(this.autoAdvanceTimer);
      this.autoAdvanceTimer = null;
    }

    if (this.hotspotEl) this.hotspotEl.style.pointerEvents = 'none';
    this.container.style.pointerEvents = 'none';

    // Blur container slightly
    this.container.classList.add('zooming');

    // Soft pink-white radial flash transition (Mục 6)
    const flashEl = document.querySelector('.thiep-8 .flash-overlay');
    if (flashEl) {
      flashEl.style.opacity = '0';
      flashEl.style.display = 'block';
      setTimeout(() => {
        flashEl.style.opacity = '1';
      }, 700);
      setTimeout(() => {
        flashEl.style.opacity = '0';
      }, 1250);
    }

    setTimeout(() => {
      this.stop();
      if (typeof this.callbacks.onZoomComplete === 'function') {
        this.callbacks.onZoomComplete();
      }
    }, 1400);
  }

  loop() {
    if (!this.isRunning) return;
    const now = performance.now();
    let dt = (now - this.lastTime) / 1000;
    dt = Math.min(dt, 0.05);
    this.lastTime = now;
    const elapsed = (now - this.startTime) / 1000;

    this.currentParallaxX += (this.targetParallaxX - this.currentParallaxX) * 0.08;
    this.currentParallaxY += (this.targetParallaxY - this.currentParallaxY) * 0.08;

    this.render(elapsed, dt);
    this.rafId = requestAnimationFrame(() => this.loop());
  }

  render(elapsed, dt) {
    const ctx = this.ctx;
    const W = this.width;
    const H = this.height;

    ctx.clearRect(0, 0, W, H);

    // Zoom multiplier
    let zoomMultiplier = 1;
    let zoomAlpha = 1;
    if (this.isZooming) {
      const zoomElapsed = (performance.now() - this.zoomStartTime) / 1000;
      this.zoomProgress = Math.min(zoomElapsed / 1.35, 1);
      const easeZoom = Math.pow(this.zoomProgress, 2.6);
      zoomMultiplier = 1 + easeZoom * 5.8;
      if (this.zoomProgress > 0.65) {
        zoomAlpha = Math.max(0, 1 - (this.zoomProgress - 0.65) / 0.35);
      }
    }

    // 1. Stars and meteors
    this.renderStars(elapsed, zoomAlpha);
    this.renderMeteors(dt, zoomAlpha);

    // 2. Coordinated Layout (Mục 4 & 5)
    // Heart center at x = 50%, y = 38.5% H
    const heartCenterX = W * 0.5 + this.currentParallaxX;
    const heartCenterY = H * 0.385 + this.currentParallaxY;
    // Common orbit center at x = 50%, y = 64% H (occupying y = 52–76%)
    const orbitCenterY = H * 0.64 + this.currentParallaxY;

    // Heartbeat pulse (Mục 4: gentle 1.8s pulse)
    const beatPhase = (elapsed % 1.8) / 1.8;
    let heartPulse = 1;
    if (beatPhase < 0.12) {
      heartPulse = 1 + Math.sin((beatPhase / 0.12) * Math.PI) * 0.022;
    } else if (beatPhase > 0.18 && beatPhase < 0.28) {
      heartPulse = 1 + Math.sin(((beatPhase - 0.18) / 0.10) * Math.PI) * 0.012;
    }

    const targetHeartWidth = Math.min(W * 0.70, 360);
    const heartBaseScale = (targetHeartWidth / 2.26) * heartPulse * zoomMultiplier;

    // 3. Render Orbit System (Back Pass: z < 0)
    this.renderOrbitSystem(elapsed, dt, heartCenterX, orbitCenterY, zoomMultiplier, zoomAlpha, false);

    // 4. Render 3D Volumetric Heart
    this.renderHeart(elapsed, heartCenterX, heartCenterY, heartBaseScale, zoomAlpha);

    // 5. Render Orbit System (Front Pass: z >= 0)
    this.renderOrbitSystem(elapsed, dt, heartCenterX, orbitCenterY, zoomMultiplier, zoomAlpha, true);
  }

  renderStars(elapsed, zoomAlpha) {
    const ctx = this.ctx;
    ctx.save();
    for (let i = 0; i < this.stars.length; i++) {
      const s = this.stars[i];
      const twinkle = Math.sin(elapsed * s.twinkleSpeed + s.phase);
      const alpha = Math.max(0.08, s.baseAlpha + twinkle * 0.25) * zoomAlpha;
      ctx.fillStyle = s.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  renderMeteors(dt, zoomAlpha) {
    this.spawnMeteor();
    const ctx = this.ctx;
    ctx.save();
    for (let i = this.meteors.length - 1; i >= 0; i--) {
      const m = this.meteors[i];
      m.life += dt;
      if (m.life >= m.maxLife) {
        this.meteors.splice(i, 1);
        continue;
      }
      const progress = m.life / m.maxLife;
      const alpha = Math.sin(progress * Math.PI) * 0.85 * zoomAlpha;
      m.x += Math.cos(m.angle) * m.speed * dt;
      m.y += Math.sin(m.angle) * m.speed * dt;

      const tailX = m.x - Math.cos(m.angle) * m.length;
      const tailY = m.y - Math.sin(m.angle) * m.length;

      const grad = ctx.createLinearGradient(tailX, tailY, m.x, m.y);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      grad.addColorStop(0.6, 'rgba(255, 210, 230, 0.4)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0.95)');

      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(m.x, m.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  renderHeart(elapsed, centerX, centerY, scaleFactor, zoomAlpha) {
    const ctx = this.ctx;
    const count = this.heartParticles.length;
    // Reveal over first 1.8s
    const revealRatio = Math.min(elapsed / 1.8, 1);
    const visibleCount = Math.floor(count * revealRatio);

    // Gentle 3D rotation: sway back and forth around vertical Y axis +-7°, tilt +-2° (Mục 4)
    const rotY = Math.sin(elapsed * 0.65) * 0.12;
    const rotX = Math.cos(elapsed * 0.45) * 0.035;

    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

    const cameraDistance = 3.6;
    const focalLength = 3.2;

    ctx.save();

    for (let i = 0; i < visibleCount; i++) {
      const p = this.heartParticles[i];

      // Subtle vibration
      const vibe = Math.sin(elapsed * p.vibeSpeed + p.vibePhase) * 0.015;
      const bx = p.baseX + vibe;
      const by = p.baseY + vibe;
      const bz = p.baseZ;

      // 3D rotation
      const x1 = bx * cosY + bz * sinY;
      const z1 = -bx * sinY + bz * cosY;
      const y1 = by * cosX - z1 * sinX;
      const z2 = by * sinX + z1 * cosX;

      const depth = cameraDistance - z2;
      if (depth <= 0.2) continue;

      const projScale = focalLength / depth;
      const sx = centerX + x1 * scaleFactor * projScale;
      // Invert Y because canvas Y goes downwards
      const sy = centerY - y1 * scaleFactor * projScale;

      // Depth shading: front particles are brighter & crisper
      const depthFactor = (z2 + 0.67) / 1.34; // 0 (far) to 1 (near)
      const particleRadius = Math.max(0.55, p.baseSize * (0.8 + depthFactor * 0.5));
      const particleAlpha = Math.min(1, Math.max(0.2, (p.alpha * (0.6 + depthFactor * 0.45)) * zoomAlpha));

      ctx.fillStyle = p.color;
      ctx.globalAlpha = particleAlpha;
      ctx.beginPath();
      ctx.arc(sx, sy, particleRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  renderOrbitSystem(elapsed, dt, centerX, centerY, zoomMultiplier, zoomAlpha, isFrontPass) {
    const ctx = this.ctx;
    const stageW = Math.min(this.width, 480);
    // Tilt angle 68 degrees (cos(68°) ~ 0.37)
    const tiltCos = 0.37;
    const cameraDist = 480;

    ctx.save();

    // 1. Dust Particles
    for (let i = 0; i < this.orbitDust.length; i++) {
      const d = this.orbitDust[i];
      d.angle += d.speed * dt;

      const r = d.radiusRatio * (stageW * 2.0) * zoomMultiplier;
      const ox = r * Math.cos(d.angle);
      const oz = r * Math.sin(d.angle); // z > 0 is front, z < 0 is back

      if ((isFrontPass && oz < 0) || (!isFrontPass && oz >= 0)) continue;

      const depth = cameraDist - oz;
      const pScale = 450 / depth;
      const sx = centerX + ox * pScale;
      const sy = centerY + (oz * tiltCos) * pScale;

      const isFront = oz > 0;
      const alpha = (isFront ? 0.75 : 0.32) * d.alpha * zoomAlpha;

      ctx.fillStyle = d.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(sx, sy, d.size * (isFront ? 1.1 : 0.75), 0, Math.PI * 2);
      ctx.fill();
    }

    // 2. Mini Hearts
    for (let i = 0; i < this.miniHearts.length; i++) {
      const mh = this.miniHearts[i];
      mh.angle += mh.speed * dt;

      const r = mh.radiusRatio * (stageW * 2.0) * zoomMultiplier;
      const ox = r * Math.cos(mh.angle);
      const oz = r * Math.sin(mh.angle);

      if ((isFrontPass && oz < 0) || (!isFrontPass && oz >= 0)) continue;

      const depth = cameraDist - oz;
      const pScale = 450 / depth;
      const sx = centerX + ox * pScale;
      const sy = centerY + (oz * tiltCos) * pScale;

      const isFront = oz > 0;
      const hScale = (isFront ? 1.1 : 0.7) * (mh.size / 6) * pScale;
      const hAlpha = (isFront ? 0.85 : 0.35) * zoomAlpha;

      ctx.fillStyle = mh.color;
      ctx.globalAlpha = hAlpha;
      this.drawMiniHeart(ctx, sx, sy, hScale);
    }

    // 3. Central Memory Photo Fragments
    for (let i = 0; i < this.orbitThumbnails.length; i++) {
      const tb = this.orbitThumbnails[i];
      tb.angle += tb.speed * dt;

      const r = tb.radiusRatio * (stageW * 2.0) * zoomMultiplier;
      const ox = r * Math.cos(tb.angle);
      const oz = r * Math.sin(tb.angle);

      if ((isFrontPass && oz < 0) || (!isFrontPass && oz >= 0)) continue;

      const depth = cameraDist - oz;
      const pScale = 450 / depth;
      const sx = centerX + ox * pScale;
      const sy = centerY + (oz * tiltCos) * pScale;

      const photoObj = this.photoImages[tb.photoIndex % this.photoImages.length];
      if (photoObj && photoObj.loaded && photoObj.img) {
        const isFront = oz > 0;
        const w = tb.width * pScale * (isFront ? 1.05 : 0.75);
        const h = tb.height * pScale * (isFront ? 1.05 : 0.75);
        const alpha = (isFront ? 0.95 : 0.45) * zoomAlpha;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(sx, sy);
        ctx.beginPath();
        ctx.roundRect(-w / 2, -h / 2, w, h, 4);
        ctx.clip();
        ctx.drawImage(photoObj.img, -w / 2, -h / 2, w, h);
        ctx.restore();

        // Delicate white/pink border with sparkle
        ctx.strokeStyle = isFront ? '#ffeef5' : '#ff7597';
        ctx.lineWidth = 1.2;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.roundRect(sx - w / 2, sy - h / 2, w, h, 4);
        ctx.stroke();

        // Warm sparkling point
        ctx.fillStyle = '#fff9d6';
        ctx.globalAlpha = (0.7 + Math.sin(elapsed * 4 + i) * 0.3) * zoomAlpha;
        ctx.beginPath();
        ctx.arc(sx + w * 0.4, sy - h * 0.4, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 4. 3D Orbiting Text Strings (Mục 5)
    for (let i = 0; i < this.orbitRings.length; i++) {
      const ring = this.orbitRings[i];
      ring.angleOffset += ring.speed * dt;
      const r = ring.radiusRatio * (stageW * 2.0) * zoomMultiplier;

      // Repeat sentence 2–3 times per ring
      const repeats = 2;
      for (let s = 0; s < repeats; s++) {
        const segAngle = ring.angleOffset + (s / repeats) * Math.PI * 2;
        const ox = r * Math.cos(segAngle);
        const oz = r * Math.sin(segAngle);

        if ((isFrontPass && oz < 0) || (!isFrontPass && oz >= 0)) continue;

        const depth = cameraDist - oz;
        const pScale = 450 / depth;
        const sx = centerX + ox * pScale;
        const sy = centerY + (oz * tiltCos) * pScale;

        const isFront = oz > 0;
        // Front text is larger, crisper, brighter; back is smaller, faded (Mục 5)
        const fontSize = Math.round((isFront ? 11.5 : 7.5) * pScale);
        const fontAlpha = (isFront ? 0.88 : 0.28) * zoomAlpha;

        ctx.font = `italic 500 ${fontSize}px 'Dancing Script', cursive, serif`;
        ctx.fillStyle = isFront ? '#ffffff' : '#ffb3cb';
        ctx.globalAlpha = fontAlpha;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ring.text, sx, sy);
      }
    }

    ctx.restore();
  }

  drawMiniHeart(ctx, x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    const s = size;
    ctx.moveTo(0, s * 0.3);
    ctx.bezierCurveTo(-s * 0.5, -s * 0.3, -s, s * 0.2, 0, s);
    ctx.bezierCurveTo(s, s * 0.2, s * 0.5, -s * 0.3, 0, s * 0.3);
    ctx.fill();
    ctx.restore();
  }

  destroy() {
    this.stop();
    if (this.autoAdvanceTimer) clearTimeout(this.autoAdvanceTimer);
    window.removeEventListener('resize', this.handleResize);
    window.removeEventListener('mousemove', this.handlePointerMove);
    window.removeEventListener('touchmove', this.handlePointerMove);
    if (this.hotspotEl && this.handleIntroClick) {
      this.hotspotEl.removeEventListener('click', this.handleIntroClick);
    }
    this.container.removeEventListener('click', this.handleIntroClick);
  }
}

if (typeof window !== 'undefined') {

  <script>
/**
 * THIỆP 8 — Phong thư trắng, rút thiệp dọc, xoay 42°, mở gáy sách 3D và bảng đọc thư
 * Tuân thủ mục 7 & 8 tài liệu đặc tả
 */

class Thiep8Letter {
  constructor(container, config, callbacks = {}) {
    this.container = container;
    this.config = config || {};
    this.callbacks = callbacks; // onLetterClosed, onOpeningComplete

    // DOM Elements
    this.envelopeWorld = container.querySelector('.envelope-world');
    this.envelopeStage = container.querySelector('.envelope-stage');
    this.envelopeContainer = container.querySelector('.envelope-container');
    this.envelopeFlap = container.querySelector('.envelope-flap-top');
    this.waxSeal = container.querySelector('.wax-seal');
    this.cardAssembly = container.querySelector('.card-book-assembly');
    this.cardLeafLeft = container.querySelector('.card-leaf-left');
    this.envelopeHint = container.querySelector('.envelope-hint');

    // Reading Modal DOM
    this.readingBackdrop = container.querySelector('.reading-backdrop');
    this.readingPanel = container.querySelector('.reading-panel');
    this.btnClose = container.querySelector('.btn-close-letter');
    this.ghostMsgEl = container.querySelector('.ghost-message');
    this.typedMsgEl = container.querySelector('.typed-message');

    this.isOpen = false;
    this.isOpening = false;
    this.isReading = false;
    this.typewriterActive = false;
    this.typewriterTimer = null;
    this.typewriterIndex = 0;
    this.graphemes = [];
    this.currentGeneration = 0;

    this.initGraphemes();
    this.bindEvents();
  }

  initGraphemes() {
    const text = this.config.message || '';
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      const segmenter = new Intl.Segmenter('vi', { granularity: 'grapheme' });
      this.graphemes = Array.from(segmenter.segment(text), s => s.segment);
    } else {
      this.graphemes = Array.from(text);
    }
  }

  bindEvents() {
    this.handleEnvelopeTrigger = (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!this.isOpen && !this.isOpening) {
        this.openLetter();
      }
    };

    if (this.envelopeContainer) {
      this.envelopeContainer.addEventListener('click', this.handleEnvelopeTrigger);
      this.envelopeContainer.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          this.openLetter();
        }
      });
    }

    if (this.waxSeal) {
      this.waxSeal.addEventListener('click', this.handleEnvelopeTrigger);
    }

    // Modal close button
    if (this.btnClose) {
      this.btnClose.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        this.closeLetter();
      });
    }

    // Modal backdrop click
    if (this.readingBackdrop) {
      this.readingBackdrop.addEventListener('click', (e) => {
        if (e.target === this.readingBackdrop) {
          e.preventDefault();
          this.closeLetter();
        }
      });
    }

    this.handleKeyDown = (e) => {
      if (this.isReading && e.key === 'Escape') {
        e.preventDefault();
        this.closeLetter();
      }
    };
    window.addEventListener('keydown', this.handleKeyDown);

  showEnvelopeScene() {
    if (this.envelopeWorld) {
      this.envelopeWorld.classList.add('active');
    }
  }

  resetToClosedState() {
    this.isOpen = false;
    this.isOpening = false;
    this.isReading = false;
    this.abortTypewriter();

    if (this.envelopeContainer) {
      this.envelopeContainer.classList.remove('flap-open');
    }
    if (this.envelopeFlap) {
      this.envelopeFlap.style.transform = 'rotateX(0deg)';
      this.envelopeFlap.style.zIndex = '8';
    }
    if (this.waxSeal) {
      this.waxSeal.classList.remove('broken');
    }
    if (this.cardAssembly) {
      this.cardAssembly.style.transition = 'none';
      this.cardAssembly.style.transform = 'translateY(0) rotate(0deg) scale(1)';
    }
    if (this.cardLeafLeft) {
      this.cardLeafLeft.style.transition = 'none';
      this.cardLeafLeft.style.transform = 'rotateY(0deg)';
    }
    if (this.readingBackdrop) {
      this.readingBackdrop.classList.remove('active');
    }
    if (this.readingPanel) {
      this.readingPanel.classList.remove('active');
    }
    if (this.envelopeStage) {

  /**
   * Coordinated 3D Vertical Card Opening Sequence (Mục 7):
   * 1. Nắp lật ra sau
   * 2. Thiệp trượt lên khỏi túi
   * 3. Thiệp xoay qua góc nghiêng lớn ~42°
   * 4. Thiệp tiến lên trước và mở như bìa sách theo bản lề dọc
   * 5. Hiện mặt trong (ảnh trái, lời nhắn phải)

  openLetter() {

    this.isOpening = true;
    this.currentGeneration++;
    const gen = this.currentGeneration;

    const isReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Wax seal breaks, hint fades
    if (this.waxSeal) {
      this.waxSeal.classList.add('broken');
    }
    if (this.envelopeHint) {
      this.envelopeHint.style.opacity = '0';
    }

    if (isReduced) {
      setTimeout(() => {
        if (gen !== this.currentGeneration) return;
        if (this.envelopeFlap) {
          this.envelopeFlap.style.transform = 'rotateX(-175deg)';
          this.envelopeFlap.style.zIndex = '1';
        }
        if (this.cardAssembly) {
          this.cardAssembly.style.transform = 'translateY(-140px) scale(1)';
        }
        setTimeout(() => {
          if (gen !== this.currentGeneration) return;
          this.showReadingPanel();
        }, 400);
      }, 150);
      return;
    }

    // 1. 100ms: Flap folds backward (rotateX 0 -> -175deg)
    setTimeout(() => {
      if (gen !== this.currentGeneration) return;
      if (this.envelopeContainer) {
        this.envelopeContainer.classList.add('flap-open');
      }
    }, 100);

    // 2. 350ms: Flap passes 90 deg -> shift z-index behind card
    setTimeout(() => {
      if (gen !== this.currentGeneration) return;
      if (this.envelopeFlap) {
        this.envelopeFlap.style.zIndex = '1';

    }, 350);

    // 3. 450–1200ms: Card slides up out of pocket while still in vertical plane
    setTimeout(() => {
      if (gen !== this.currentGeneration) return;
      if (this.cardAssembly) {
        this.cardAssembly.style.transition = 'transform 0.75s cubic-bezier(.22, .61, .36, 1)';
        this.cardAssembly.style.transform = 'translateY(-145px) translateZ(10px)';

    }, 450);

    // 4. 1150–1800ms: Card rotates on plane through large tilt angle (~42°), then advances forward
    setTimeout(() => {
      if (gen !== this.currentGeneration) return;
      if (this.cardAssembly) {
        this.cardAssembly.style.transition = 'transform 0.75s cubic-bezier(.16, 1, .3, 1)';
        // Rotate through ~42° tilt, then settle upright with slight -6° tilt
        this.cardAssembly.style.transform = 'translateY(-190px) translateZ(85px) rotate(-6deg) scale(1.12)';

    setTimeout(() => {

        this.cardLeafLeft.style.transform = 'rotateY(-150deg)';

    setTimeout(() => {

  }

  showReadingPanel() {
    this.isOpen = true;

    this.isReading = true;

  startTypewriter() {

    if (this.ghostMsgEl) {

  abortTypewriter() {

    if (this.typewriterTimer) {

      this.typewriterTimer = null;

  /**

  closeLetter() {

      this.readingPanel.classList.remove('active');
    }
    if (this.readingBackdrop) {
      this.readingBackdrop.classList.remove('active');
    }

    // Hide envelope during gallery
    if (this.envelopeStage) {
      this.envelopeStage.classList.add('hidden-during-gallery');
    }

    if (typeof this.callbacks.onLetterClosed === 'function') {
      this.callbacks.onLetterClosed();
    }
  }

  /**
   * Return envelope back into position after gallery (Mục 10)
   */
  returnEnvelopeAfterGallery() {
    this.resetToClosedState();
    if (this.envelopeStage) {
      this.envelopeStage.classList.remove('hidden-during-gallery');
    }
    if (this.envelopeHint) {
      this.envelopeHint.textContent = 'Nhấn vào thư để mở lại 💌';
      this.envelopeHint.style.opacity = '1';
    }
  }

  destroy() {
    this.abortTypewriter();
    window.removeEventListener('keydown', this.handleKeyDown);
  }
}

if (typeof window !== 'undefined') {
  window.Thiep8Letter = Thiep8Letter;

  <script>
/**
 * THIỆP 8 — Tim nền phát sáng & Ảnh kỷ niệm bay tuần hoàn
 * Tuân thủ mục 10 tài liệu đặc tả
 */

class Thiep8Gallery {
  constructor(container, config, callbacks = {}) {
    this.container = container;
    this.config = config || {};
    this.callbacks = callbacks; // onGalleryComplete

    this.galleryContainer = container.querySelector('.gallery-container');
    this.heartsLayer = container.querySelector('.floating-hearts-layer');

    this.isRunning = false;
    this.galleryTimer = null;
    this.spawnIntervalTimer = null;
    this.activeCards = [];
    this.spawnCount = 0;

    this.initBackgroundHearts();
  }

  /**
   * Pre-populated background floating hearts with glowing halo (Mục 10)
   * Staggered initial vertical positions so the screen is immediately populated!
   */
  initBackgroundHearts() {
    if (!this.heartsLayer) return;
    this.heartsLayer.innerHTML = '';

    const heartColors = ['#ffffff', '#ffe0eb', '#ff9dbc', '#ff4d92', '#ff0068', '#d50065'];
    const heartCount = window.innerWidth < 600 ? 16 : 22;

    for (let i = 0; i < heartCount; i++) {
      const el = document.createElement('div');
      el.className = 'bg-heart';
      el.innerHTML = '♥';

      const size = 13 + Math.random() * 24; // 13px to 37px
      const left = 3 + Math.random() * 92; // 3% to 95%
      const duration = 7 + Math.random() * 6; // 7s to 13s
      // Negative animation delay pre-populates hearts across the vertical screen!
      const initialDelay = -Math.random() * duration;
      const driftX = (Math.random() - 0.5) * 40;
      const rot = (Math.random() - 0.5) * 45;
      const color = heartColors[Math.floor(Math.random() * heartColors.length)];

      el.style.fontSize = `${size}px`;
      el.style.left = `${left}%`;
      el.style.color = color;
      el.style.animationDuration = `${duration}s`;
      el.style.animationDelay = `${initialDelay}s`;
      el.style.setProperty('--drift-x', `${driftX}px`);
      el.style.setProperty('--rot', `${rot}deg`);

      this.heartsLayer.appendChild(el);
    }
  }

  /**
   * Start Floating Memory Photos Gallery Sequence (Mục 10)
   * 2–3 photos visible simultaneously, alternating left and right lanes, cycling smoothly
   */
  start() {
    this.stop();
    this.isRunning = true;
    this.spawnCount = 0;

    const photos = this.config.photos || [];
    if (photos.length === 0) {
      this.scheduleCompletion(6000);
      return;
    }

    // Spawn first photo after 350ms
    setTimeout(() => {
      if (this.isRunning) this.spawnNextPhoto();
    }, 350);

    // Continuous spawn interval ~1.9s
    this.spawnIntervalTimer = setInterval(() => {
      if (this.isRunning) {
        this.spawnNextPhoto();
      }
    }, 1900);

    // Total gallery duration before envelope returns (~12s - Mục 10)
    const galleryDuration = (this.config.gallery && this.config.gallery.durationMs) || 12000;
    this.scheduleCompletion(galleryDuration);
  }

  spawnNextPhoto() {
    const photos = this.config.photos || [];
    if (photos.length === 0) return;

    const photoData = photos[this.spawnCount % photos.length];
    // Alternating lanes: left (~27% W), right (~73% W), center-offset
    const isLeft = (this.spawnCount % 2 === 0);
    const xRatio = isLeft ? 0.27 : 0.73;
    const tiltAngle = isLeft ? -4.5 : 5.0;

    this.spawnFloatingCard(photoData, xRatio, tiltAngle);
    this.spawnCount++;
  }

  spawnFloatingCard(photoData, xRatio, tiltAngle) {
    if (!this.galleryContainer) return;

    const card = document.createElement('div');
    card.className = 'floating-memory-card';

    const img = document.createElement('img');
    img.className = 'floating-memory-img';
    img.src = photoData.src;
    img.alt = photoData.alt || 'Ảnh người nhận';
    if (photoData.objectPosition) {
      img.style.objectPosition = photoData.objectPosition;
    }
    card.appendChild(img);

    this.galleryContainer.appendChild(card);
    this.activeCards.push(card);

    const W = this.container.clientWidth || window.innerWidth;
    const H = this.container.clientHeight || window.innerHeight;

    const cardWidth = Math.min(Math.max(W * 0.40, 135), 170);
    const cardHeight = cardWidth * 1.15;
    const posX = W * xRatio - cardWidth / 2;

    const startY = H + 25;
    const endY = -cardHeight - 45;
    const duration = 4600; // 4.6 seconds smooth vertical float

    const swayX = (Math.random() - 0.5) * 20;

    // WAAPI for hardware-accelerated 60fps
    const animation = card.animate([
      {
        transform: `translate3d(${posX}px, ${startY}px, 0) rotate(${tiltAngle * 0.7}deg) scale(0.92)`,
        opacity: 0
      },
      {
        offset: 0.12,
        opacity: 1
      },
      {
        offset: 0.5,
        transform: `translate3d(${posX + swayX}px, ${startY * 0.5 + endY * 0.5}px, 0) rotate(${tiltAngle}deg) scale(1.02)`
      },
      {
        offset: 0.88,
        opacity: 1
      },
      {
        transform: `translate3d(${posX}px, ${endY}px, 0) rotate(${tiltAngle * 1.1}deg) scale(0.95)`,
        opacity: 0
      }
    ], {
      duration: duration,
      easing: 'cubic-bezier(.25, .46, .45, .94)',
      fill: 'forwards'
    });

    animation.onfinish = () => {
      if (card.parentNode) {
        card.parentNode.removeChild(card);
      }
      const idx = this.activeCards.indexOf(card);
      if (idx !== -1) this.activeCards.splice(idx, 1);
    };
  }

  scheduleCompletion(delayMs) {
    this.galleryTimer = setTimeout(() => {
      if (!this.isRunning) return;
      this.stop();
      if (typeof this.callbacks.onGalleryComplete === 'function') {
        this.callbacks.onGalleryComplete();
      }
    }, delayMs);
  }

  stop() {
    this.isRunning = false;
    if (this.galleryTimer) {
      clearTimeout(this.galleryTimer);
      this.galleryTimer = null;
    }
    if (this.spawnIntervalTimer) {
      clearInterval(this.spawnIntervalTimer);
      this.spawnIntervalTimer = null;
    }

    this.activeCards.forEach(card => {
      if (card.parentNode) card.parentNode.removeChild(card);
    });
    this.activeCards = [];
  }

  destroy() {
    this.stop();
  }
}

if (typeof window !== 'undefined') {
  window.Thiep8Gallery = Thiep8Gallery;
}

  <script>
/**
 * THIỆP 8 — Master Orchestrator & State Machine
 * Tuân thủ mục 11 & toàn bộ tài liệu đặc tả
 */

(function () {
  'use strict';

  const STATES = {
    BOOT: 'BOOT',
    UNIVERSE: 'UNIVERSE',
    ZOOM_TRANSITION: 'ZOOM_TRANSITION',
    ENVELOPE_IDLE: 'ENVELOPE_IDLE',
    LETTER_OPENING: 'LETTER_OPENING',
    READING: 'READING',
    READING_CLOSING: 'READING_CLOSING',
    GALLERY: 'GALLERY',
    DESTROYED: 'DESTROYED'
  };

  class Thiep8Controller {
    constructor(rootEl, config) {
      this.root = typeof rootEl === 'string' ? document.querySelector(rootEl) : rootEl;
      if (!this.root) {
        throw new Error('Thiep8Controller: Root element not found');
      }

      this.config = Object.assign({}, window.THIEP_8_CONFIG || {}, config || {});
      this.state = STATES.BOOT;
      this.isFirstEnvelopePass = true;
      this.autoOpenTimer = null;

      this.universe = null;
      this.letter = null;
      this.gallery = null;

      this.initDom();
      this.initComponents();
      this.bindGlobalEvents();
    }

    initDom() {
      const coverEyebrow = this.root.querySelector('.cover-eyebrow');
      if (coverEyebrow && this.config.coverEyebrow) {
        coverEyebrow.textContent = this.config.coverEyebrow;
      }

      const coverTitle = this.root.querySelector('.cover-title');
      if (coverTitle && this.config.coverTitle) {
        coverTitle.textContent = this.config.coverTitle;
      }

      // Bind user portrait photo
      const primaryIndex = this.config.primaryPhotoIndex || 0;
      const primaryPhoto = (this.config.photos && this.config.photos[primaryIndex]) || (this.config.photos && this.config.photos[0]) || { src: '' };

      const innerPhoto = this.root.querySelector('.inner-photo-img');
      if (innerPhoto) {
        innerPhoto.src = primaryPhoto.src;
        innerPhoto.alt = primaryPhoto.alt || 'Ảnh người nhận';
        if (primaryPhoto.objectPosition) {
          innerPhoto.style.objectPosition = primaryPhoto.objectPosition;
        }
      }

      const modalPhoto = this.root.querySelector('.modal-photo-img');
      if (modalPhoto) {
        modalPhoto.src = primaryPhoto.src;
        modalPhoto.alt = primaryPhoto.alt || 'Ảnh người nhận';
        if (primaryPhoto.objectPosition) {
          modalPhoto.style.objectPosition = primaryPhoto.objectPosition;
        }
      }

      // Inside card preview text
      const cardPreview = this.root.querySelector('.card-preview-text');
      if (cardPreview && this.config.message) {
        const snippet = this.config.message.length > 70
          ? this.config.message.slice(0, 68) + '...'
          : this.config.message;
        cardPreview.textContent = snippet;
      }
    }

    initComponents() {
      // 1. Universe World
      const universeEl = this.root.querySelector('.universe-scene');
      if (universeEl) {
        this.universe = new window.Thiep8Universe(universeEl, this.config, {
          onZoomComplete: () => this.handleZoomComplete()
        });
      }

      // 2. Letter & Envelope
      this.letter = new window.Thiep8Letter(this.root, this.config, {
        onOpeningComplete: () => {
          this.state = STATES.READING;
        },
        onLetterClosed: () => {
          this.handleLetterClosed();
        }
      });

      // 3. Gallery & Floating Hearts
      this.gallery = new window.Thiep8Gallery(this.root, this.config, {
        onGalleryComplete: () => {
          this.handleGalleryFinished();
        }
      });
    }

    bindGlobalEvents() {
      this.handleVisibilityChange = () => {
        if (document.hidden) {
          if (this.universe && this.state === STATES.UNIVERSE) {
            this.universe.stop();
          }
        } else {
          if (this.universe && this.state === STATES.UNIVERSE) {
            this.universe.start();
          }
        }
      };
      document.addEventListener('visibilitychange', this.handleVisibilityChange);
    }

    start() {
      this.transitionTo(STATES.UNIVERSE);
      if (this.universe) {
        this.universe.start();
      }
    }

    transitionTo(newState) {
      this.state = newState;
    }

    handleZoomComplete() {
      this.transitionTo(STATES.ENVELOPE_IDLE);

      const universeEl = this.root.querySelector('.universe-scene');
      if (universeEl) {
        universeEl.style.display = 'none';
      }

      if (this.letter) {
        this.letter.showEnvelopeScene();
      }

      // First pass auto-open after 500ms (Mục 7)
      if (this.isFirstEnvelopePass) {
        this.isFirstEnvelopePass = false;
        this.autoOpenTimer = setTimeout(() => {
          if (this.state === STATES.ENVELOPE_IDLE) {
            this.openLetter();
          }
        }, 500);
      }
    }

    openLetter() {
      if (this.state === STATES.UNIVERSE || this.state === STATES.BOOT) {
        if (this.universe) {
          this.universe.triggerZoom();
        }
        return;
      }
      if (this.autoOpenTimer) {
        clearTimeout(this.autoOpenTimer);
        this.autoOpenTimer = null;
      }
      this.transitionTo(STATES.LETTER_OPENING);
      if (this.letter) {
        this.letter.openLetter();
      }
    }

    closeLetter() {
      if (this.autoOpenTimer) {
        clearTimeout(this.autoOpenTimer);
        this.autoOpenTimer = null;
      }
      if (this.letter) {
        this.letter.closeLetter();
      }
    }

    handleLetterClosed() {
      this.transitionTo(STATES.READING_CLOSING);
      setTimeout(() => {
        this.transitionTo(STATES.GALLERY);
        if (this.gallery) {
          this.gallery.start();
        }
      }, 350);
    }

    handleGalleryFinished() {
      this.transitionTo(STATES.ENVELOPE_IDLE);
      if (this.letter) {
        this.letter.returnEnvelopeAfterGallery();
      }
    }

    /**
     * Clean replay from Universe scene
     */
    replay() {
      if (this.autoOpenTimer) {
        clearTimeout(this.autoOpenTimer);
        this.autoOpenTimer = null;
      }

      if (this.gallery) {
        this.gallery.stop();
      }

      if (this.letter) {
        this.letter.resetToClosedState();
      }
      const envelopeWorld = this.root.querySelector('.envelope-world');
      if (envelopeWorld) {
        envelopeWorld.classList.remove('active');
      }

      const flashEl = this.root.querySelector('.flash-overlay');
      if (flashEl) {
        flashEl.style.opacity = '0';
        flashEl.style.display = 'none';
      }

      const universeEl = this.root.querySelector('.universe-scene');
      if (universeEl) {
        universeEl.style.display = 'block';
        universeEl.classList.remove('zooming');
      }

      if (this.universe) {
        this.universe.destroy();
        this.universe = new window.Thiep8Universe(universeEl, this.config, {
          onZoomComplete: () => this.handleZoomComplete()
        });
      }

      this.isFirstEnvelopePass = true;
      this.start();
    }

    destroy() {
      this.state = STATES.DESTROYED;
      if (this.autoOpenTimer) clearTimeout(this.autoOpenTimer);
      if (this.universe) this.universe.destroy();
      if (this.letter) this.letter.destroy();
      if (this.gallery) this.gallery.destroy();
      document.removeEventListener('visibilitychange', this.handleVisibilityChange);
    }
  }

  function createThiep8(rootElement, userConfig) {
    return new Thiep8Controller(rootElement, userConfig);
  }

  window.createThiep8 = createThiep8;
  window.Thiep8Controller = Thiep8Controller;

  document.addEventListener('DOMContentLoaded', () => {
    const rootEl = document.getElementById('thiep-8-app');
    if (rootEl) {
      const app = createThiep8(rootEl, window.THIEP_8_CONFIG);
      window.__thiep8Instance = app;
      app.start();
    }
  });
})();
